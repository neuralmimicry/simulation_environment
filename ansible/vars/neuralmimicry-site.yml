---
# Site deployment profile for neuralmimicry.ai. Kept with the Webots
# implementation so a normal Ansible deployment selects the persistent
# shared fleet world and links back to this repository.
continuum_tenant_webots_client_user: "pbisaacs"
continuum_tenant_webots_image: "ghcr.io/neuralmimicry/webots:latest"
continuum_tenant_webots_build_image: true
continuum_tenant_webots_use_local_dev_source: true
simulation_environment_webots_access_token_file_source: >-
  {{
    lookup('env', 'AARNN_WEBOTS_ACCESS_TOKEN_FILE')
    | default(playbook_dir ~ '/.secrets/customers/spirit/webots_access_token', true)
  }}
continuum_tenant_webots_registry_secret_enable: true
continuum_tenant_webots_registry_secret_source_namespaces:
  - "aarnn"
  - "nmchain"
  - "refiner"
continuum_tenant_webots_dns_target_ip: "{{ hostvars['vega'].ansible_host | default('192.168.1.1') }}"
continuum_tenant_webots_dns_server: "vega"
continuum_tenant_webots_dns_servers:
  - "vega"
continuum_tenant_webots_ingress_ssl_redirect: false
continuum_tenant_webots_ingress_force_ssl_redirect: false
continuum_tenant_webots_enable_tls: false
continuum_tenant_webots_aarnn_app_base: "https://aarnn.neuralmimicry.ai"
continuum_tenant_webots_central_auth_api_base: "{{ continuum_shared_auth_api_internal_base_url }}"
continuum_tenant_webots_cookie_domain: ".neuralmimicry.ai"
continuum_tenant_webots_secure_cookies: true
continuum_tenant_webots_world_source_base_url: "https://github.com/neuralmimicry/simulation_environment/blob/main"
continuum_tenant_webots_cloud_run_base_url: ""
continuum_tenant_webots_default_world: "shared-fleet"
continuum_tenant_webots_replicas: 2
continuum_tenant_webots_hpa_min_replicas: 2
continuum_tenant_webots_hpa_max_replicas: 8

# These are logical AARNN networks, not worker hosts. The two networks that
# currently exist are each represented by one embodied agent in the persistent
# shared world; AARNN resolves their live distributed placement across qc/sm.
simulation_environment_webots_network_bindings:
  AARNN_NETWORK_SHARED_SNN:
    network_id: neuralmimicry-shared-snn
    # The AARNN shared SNN uses the generic 32/16 profile. Reuse the existing
    # Hexapod body, excluding its 1x1 event camera (two channels) from inputs
    # and using the first 16 of its 18 motors.
    sensor_regex: '^hex_s_(0[0-9]|1[0-9]|2[0-5]|27|28)_.*$'
    actuator_regex: '^hex_o_(00[0-9]|01[0-5])_.*$'
    expected_sensory: 32
    expected_outputs: 16
  AARNN_NETWORK_TENANT:
    network_id: tenant-aarnn
    sensor_regex: '^hex_s_(0[0-9]|1[0-9]|2[0-5]|27|28)_.*$'
    actuator_regex: '^hex_o_(00[0-9]|01[0-5])_.*$'
    expected_sensory: 32
    expected_outputs: 16

# Let the AARNN API resolve a live activity source from current placement.
# Fixed worker addresses can point at a backup shard or become stale after a
# placement change. Sensory injection always goes through the orchestrator.
simulation_environment_webots_activity_addr: ""

# The AARNN Webots service account receives sensory-input rights only for the
# networks embodied in this shared scene. Removing a principal/network pair
# and rolling aarnn-web-ui revokes that peripheral grant.
simulation_environment_webots_peripheral_input_grants:
  neuralmimicry-shared-snn:
    - webots
  tenant-aarnn:
    - webots
simulation_environment_webots_simulation_ingress_principals:
  - webots

simulation_environment_webots_aarnn_namespace: aarnn
simulation_environment_webots_aarnn_bearer_secret: nm-webots-sensory-ingress
simulation_environment_webots_aarnn_bearer_file: /etc/neuralmimicry/webots/aarnn_orchestrator_bearer
simulation_environment_webots_aarnn_orchestrator_image: "ghcr.io/neuralmimicry/aarnn_rust:webots-20260930-snapshot-metadata-orchestrator-arm64-64k-hwe"
# The all-feature orchestrator image contains the same worker RPC server; the
# engine DaemonSet supplies its own `--node` command and args.
simulation_environment_webots_aarnn_engine_image: "ghcr.io/neuralmimicry/aarnn_rust:webots-20260930-snapshot-metadata-node-arm64-64k-hwe"
simulation_environment_webots_aarnn_web_ui_image: "ghcr.io/neuralmimicry/aarnn_rust:webots-20260930-secure-web-ui-arm64-64k-hwe"
