# Managed native AARNN worker services. This list defines worker membership;
# each rollout queries live placement and builds a temporary safe host order
# with the current layer-0 sensory ingress owner last.
[aarnn_sensory_workers]
qc00 ansible_host=192.168.1.60
qc02 ansible_host=192.168.1.62
qc03 ansible_host=192.168.1.63
qc04 ansible_host=192.168.1.64
sm00 ansible_host=192.168.1.66
sm01 ansible_host=192.168.1.68

[aarnn_sensory_workers:vars]
ansible_user=pbisaacs
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args="-o BatchMode=yes -o StrictHostKeyChecking=accept-new"

[webots_fleet]
sm00
sm01

[webots_fleet:vars]
ansible_user=pbisaacs
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args="-o BatchMode=yes -o StrictHostKeyChecking=accept-new"

[aarnn_control]
spirit ansible_host=192.168.1.2

[aarnn_control:vars]
ansible_user=pbisaacs
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args="-o BatchMode=yes -o StrictHostKeyChecking=accept-new"
