# Managed native AARNN worker services. Keep the order aligned with the live
# shared-SNN placement: inactive workers first, then other shard owners, and
# the current layer-0 sensory ingress owner last. The rollout preflight queries
# AARNN and fails closed if placement no longer matches this order.
[aarnn_sensory_workers]
sm00 ansible_host=192.168.1.66
sm01 ansible_host=192.168.1.68
qc02 ansible_host=192.168.1.62
qc03 ansible_host=192.168.1.63
qc04 ansible_host=192.168.1.64

[aarnn_sensory_workers:vars]
ansible_user=pbisaacs
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args="-o BatchMode=yes -o StrictHostKeyChecking=accept-new"

[webots_fleet]
sm00
sm01

[webots_fleet:vars]
ansible_user=pbisaacs
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args="-o BatchMode=yes -o StrictHostKeyChecking=accept-new"

[aarnn_control]
spirit ansible_host=192.168.1.2

[aarnn_control:vars]
ansible_user=pbisaacs
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args="-o BatchMode=yes -o StrictHostKeyChecking=accept-new"
