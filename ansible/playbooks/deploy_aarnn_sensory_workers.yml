---
- name: Roll out the Webots sensory-ingress RPCs to active AARNN workers
  # qc01 hosts the Kubernetes engine DaemonSet; roll native AARNN workers only.
  hosts: "qc00:qc02:qc03:qc04:qc05:sm00:sm01"
  become: true
  serial: 1
  gather_facts: true
  vars:
    simulation_environment_aarnn_node_binary_source_x86_64: "{{ lookup('env', 'AARNN_NODE_BINARY_X86_64') | default('', true) }}"
    simulation_environment_aarnn_node_binary_source_aarch64: "{{ lookup('env', 'AARNN_NODE_BINARY_AARCH64') | default('', true) }}"
    simulation_environment_aarnn_node_binary_path: /usr/bin/aarnn_rust
    simulation_environment_aarnn_node_service: aarnn-node.service
    simulation_environment_aarnn_node_port: 50051
  pre_tasks:
    - name: Require release binaries for both active worker architectures
      ansible.builtin.assert:
        that:
          - simulation_environment_aarnn_node_binary_source_x86_64 | length > 0
          - simulation_environment_aarnn_node_binary_source_aarch64 | length > 0
        fail_msg: >-
          Set AARNN_NODE_BINARY_X86_64 and AARNN_NODE_BINARY_AARCH64 to release
          aarnn_rust executables built from codex/webots-api-ingress-20260929.
      run_once: true

    - name: Inspect the local x86-64 worker binary
      ansible.builtin.stat:
        path: "{{ simulation_environment_aarnn_node_binary_source_x86_64 }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: simulation_environment_aarnn_node_binary_stat_x86_64

    - name: Inspect the local AArch64 worker binary
      ansible.builtin.stat:
        path: "{{ simulation_environment_aarnn_node_binary_source_aarch64 }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: simulation_environment_aarnn_node_binary_stat_aarch64

    - name: Require both local worker binaries to be regular files
      ansible.builtin.assert:
        that:
          - simulation_environment_aarnn_node_binary_stat_x86_64.stat.exists
          - simulation_environment_aarnn_node_binary_stat_x86_64.stat.isreg
          - simulation_environment_aarnn_node_binary_stat_aarch64.stat.exists
          - simulation_environment_aarnn_node_binary_stat_aarch64.stat.isreg
        fail_msg: "Both architecture-specific worker binary paths must exist as regular files."
      run_once: true

    - name: Verify the x86-64 release binary architecture
      ansible.builtin.command:
        argv:
          - file
          - --brief
          - "{{ simulation_environment_aarnn_node_binary_source_x86_64 }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: simulation_environment_aarnn_node_binary_type_x86_64
      changed_when: false

    - name: Verify the AArch64 release binary architecture
      ansible.builtin.command:
        argv:
          - file
          - --brief
          - "{{ simulation_environment_aarnn_node_binary_source_aarch64 }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: simulation_environment_aarnn_node_binary_type_aarch64
      changed_when: false

    - name: Require both release binaries to match their declared architectures
      ansible.builtin.assert:
        that:
          - "'x86-64' in simulation_environment_aarnn_node_binary_type_x86_64.stdout"
          - "'aarch64' in simulation_environment_aarnn_node_binary_type_aarch64.stdout"
        fail_msg: >-
          The Webots sensory workers require one x86-64 artifact for sm00/sm01
          and one AArch64 artifact for qc02-qc04.
      run_once: true

    - name: Require a supported native worker architecture
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] in ['x86_64', 'aarch64']
        fail_msg: "No AARNN sensory worker binary is configured for this host architecture."

    - name: Select the worker binary matching this host architecture
      ansible.builtin.set_fact:
        simulation_environment_aarnn_node_binary_source: >-
          {{ simulation_environment_aarnn_node_binary_source_aarch64
             if ansible_facts['architecture'] == 'aarch64'
             else simulation_environment_aarnn_node_binary_source_x86_64 }}

    - name: Enable Ubuntu 24.04 compatibility packages for x86-64 AARNN workers
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/aarnn-opencv-compat.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
      when:
        - ansible_facts['architecture'] == 'x86_64'
        - ansible_facts['distribution_release'] == 'resolute'
      register: simulation_environment_aarnn_opencv_compat_source

    - name: Refresh APT after enabling Ubuntu 24.04 compatibility packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      when:
        - ansible_facts['architecture'] == 'x86_64'
        - ansible_facts['distribution_release'] == 'resolute'
        - simulation_environment_aarnn_opencv_compat_source.changed | default(false)

    - name: Install OpenCV 4.6 video I/O runtime for x86-64 workers
      ansible.builtin.apt:
        name: libopencv-videoio406t64
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['architecture'] == 'x86_64'

    - name: Install GPGME 1.1 ABI runtime for x86-64 workers
      ansible.builtin.apt:
        name: "{{ 'libgpgme11t64' if ansible_facts['distribution_release'] in ['noble', 'resolute'] else 'libgpgme11' }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['architecture'] == 'x86_64'

    - name: Verify the GPGME 1.1 ABI is available to x86-64 workers
      ansible.builtin.command:
        argv:
          - ldconfig
          - -p
      register: simulation_environment_aarnn_gpgme_library_cache
      changed_when: false
      when: ansible_facts['architecture'] == 'x86_64'

    - name: Require libgpgme.so.11 for x86-64 AARNN workers
      ansible.builtin.assert:
        that:
          - "'libgpgme.so.11' in simulation_environment_aarnn_gpgme_library_cache.stdout"
        fail_msg: "{{ inventory_hostname }} does not expose libgpgme.so.11 required by its x86-64 AARNN worker."
      when: ansible_facts['architecture'] == 'x86_64'

    - name: Verify the OpenCV 4.6 video I/O runtime is installed
      ansible.builtin.command:
        argv:
          - dpkg-query
          - --show
          - --showformat=${Status} ${Version}
          - libopencv-videoio406t64
      register: simulation_environment_aarnn_opencv_videoio
      changed_when: false
      when: ansible_facts['architecture'] == 'x86_64'

    - name: Require the OpenCV 4.6 video I/O package status
      ansible.builtin.assert:
        that:
          - simulation_environment_aarnn_opencv_videoio.stdout is search('install ok installed 4[.]6[.]0')
        fail_msg: "{{ inventory_hostname }} does not have the OpenCV 4.6 video I/O runtime required by the x86-64 worker binary."
      when: ansible_facts['architecture'] == 'x86_64'

  tasks:
    - name: Require the native worker service to be active before replacement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ simulation_environment_aarnn_node_service }}"
      register: simulation_environment_aarnn_node_active
      changed_when: false
      failed_when: simulation_environment_aarnn_node_active.stdout != "active"

    - name: Stage the candidate worker binary for a remote load check
      ansible.builtin.copy:
        src: "{{ simulation_environment_aarnn_node_binary_source }}"
        dest: /tmp/aarnn_rust.webots-ingress
        owner: root
        group: root
        mode: "0755"

    - name: Check that the candidate worker binary starts and exposes its CLI
      ansible.builtin.command:
        argv:
          - /tmp/aarnn_rust.webots-ingress
          - --help
      register: simulation_environment_aarnn_node_help
      changed_when: false

    - name: Require node mode in the candidate worker binary
      ansible.builtin.assert:
        that:
          - "'--node' in simulation_environment_aarnn_node_help.stdout"
        fail_msg: "The candidate binary does not expose the native AARNN node mode."

    - name: Require the candidate Prepare/Commit sensory RPC implementation
      ansible.builtin.command:
        argv:
          - grep
          - --binary-files=text
          - --quiet
          - prepare_sensory_input
          - /tmp/aarnn_rust.webots-ingress
      changed_when: false

    - name: Create a root-owned rollback directory
      ansible.builtin.file:
        path: /usr/local/lib/neuralmimicry/rollback
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Preserve the currently installed worker binary
      ansible.builtin.copy:
        src: "{{ simulation_environment_aarnn_node_binary_path }}"
        dest: >-
          /usr/local/lib/neuralmimicry/rollback/aarnn_rust.{{ ansible_facts['date_time']['iso8601_basic_short'] }}
        remote_src: true
        owner: root
        group: root
        mode: "0755"
        force: false

    - name: Install the Webots-capable worker binary
      ansible.builtin.copy:
        src: /tmp/aarnn_rust.webots-ingress
        dest: "{{ simulation_environment_aarnn_node_binary_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart the AARNN native worker

    - name: Remove the staged worker binary
      ansible.builtin.file:
        path: /tmp/aarnn_rust.webots-ingress
        state: absent

    - name: Apply the worker update before rolling to the next host
      ansible.builtin.meta: flush_handlers

    - name: Wait for the native worker gRPC port to return
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ simulation_environment_aarnn_node_port }}"
        state: started
        delay: 2
        timeout: 90

    - name: Confirm the native worker service remains active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ simulation_environment_aarnn_node_service }}"
      changed_when: false
      register: simulation_environment_aarnn_node_after
      failed_when: simulation_environment_aarnn_node_after.stdout != "active"

  handlers:
    - name: Restart the AARNN native worker
      ansible.builtin.systemd:
        name: "{{ simulation_environment_aarnn_node_service }}"
        state: restarted
